spring:
  application:
    name: finance-tracker
  datasource:
    url: jdbc:postgresql://localhost:5432/finance_tracker
    username: finance_user
    password: finance_pass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

app:
  session:
    expiry-hours: 168
  cors:
    allowed-origins:
      - http://127.0.0.1:5500
      - http://localhost:5500
      - http://127.0.0.1:5173
      - http://localhost:5173
      - http://127.0.0.1:8080
      - http://localhost:8080
      - https://finance-two-pi.vercel.app

logging:
  level:
    com.financetracker: INFO
    org.springframework.security: WARN
