databases:
  - name: finance-tracker-db-new
    plan: free

services:
  - type: web
    name: finance-tracker-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /
    envVars:
      - key: PORT
        value: 8080
      - key: DB_HOST
        fromDatabase:
          name: finance-tracker-db-new
          property: host
      - key: DB_PORT
        fromDatabase:
          name: finance-tracker-db-new
          property: port
      - key: DB_NAME
        fromDatabase:
          name: finance-tracker-db-new
          property: database
      - key: DB_USER
        fromDatabase:
          name: finance-tracker-db-new
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: finance-tracker-db-new
          property: password
      - key: APP_CORS_ALLOWED_ORIGINS
        sync: false

